[package]
name = "astrobiz-desktop"
version = "0.1.0"
description = "AstroBiz OS - Desktop Application"
authors = ["AstroBiz Team"]
edition = "2021"
build = "src-tauri/build.rs"

[lib]
name = "astrobiz_desktop_lib"
path = "src-tauri/lib.rs"

[[bin]]
name = "astrobiz-desktop"
path = "src-tauri/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
tokio = { version = "1", features = ["full"] }
